name: Deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deploy
        run: |
          echo "Deploying ai-control-center → Coolify uuid=hokscgg48sowg44wwc044gk8"
          curl -s -f -X POST \
            "https://coolify.ofshore.dev/api/v1/deploy?uuid=hokscgg48sowg44wwc044gk8&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            && echo "✅ Deploy triggered" || echo "⚠️ Deploy trigger failed (non-critical)"
