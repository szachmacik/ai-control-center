name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── CI: TypeScript check + Vitest ───────────────────────────────────────────
  test:
    name: Test (TypeScript + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Run tests
        run: npm test -- --reporter=verbose
        env:
          NODE_ENV: test

  # ─── Deploy: trigger Coolify after successful CI on main ─────────────────────
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: Trigger Coolify deploy
        run: |
          echo "Triggering Coolify deploy..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://coolify.ofshore.dev/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}/deploy?force=false")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy triggered successfully!"
          else
            echo "Deploy trigger failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Wait for deploy and verify
        run: |
          echo "Waiting 60s for deploy to complete..."
          sleep 60
          echo "Checking health..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ai-control-center.ofshore.dev/health 2>/dev/null || echo "000")
            echo "Health check $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "App is healthy!"
              exit 0
            fi
            sleep 15
          done
          echo "Warning: Health check did not return 200, but deploy was triggered."
